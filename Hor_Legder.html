<!DOCTYPE html>
<html lang = "en">
	<head>
		<meta charset = "utf-8"/>
		<meta name = "viewport" content = "width = device-width, initial-scale = 1,0"/>
		<meta name = "author" content = "Tsebang Maduna">
		<title> Ngubane | Horwits </title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
		<link rel = "stylesheet" href = "css/custom.css">
	</head>
	
	<body class = "container d-flex flex-column justify-content-center align-items-center min-vh-100 thukzin">
		<!-- NavBar-->
		<nav class = "navbar navbar-expand-md bg-warning fixed-top">
			
		</nav>
		<h1>08 Horwits</h1>
		<h3 class = "text-center"> 2026 Expense Ledger </h3>
		
		<p>
			This document serves as an expense ledger for the above mentioned house, 
			it is to be used only by the caretaker of the house as they'll be held accountable for any inaccuracy.
		</p>
		
		<main class = "d-flex flex-column justify-content-center align-items-center bg-warning p-4 rounded flex-grow-1 fw">
			<section class="d-flex align-items-center justify-content-center fw">
				<div class="card shadow-sm border-0">
					<div class="card-body">
						<h4 class="card-title text-center mb-4">Data Capture</h4>
						<form action="https://formspree.io/f/xojjjjyj" method="POST">
							<div class="mb-3">
								<label class="form-label">Item:</label>
								
								<div class = "form-check">
									<input class = "form-check-input" type = "radio" name = "item" value = "electricity" required>
									<label class = "form-check-label"> Electricity </label>
								</div>	
								
								<div class = "form-check">
									<input class = "form-check-input" type = "radio" name = "item" value = "water" required>
									<label class = "form-check-label"> Water </label>
								</div>
							</div>
							
							<div class = "mb-3">
								<label for="amount" class="form-label">Amount:</label>
							</div>
							
							<div class="input-group">
								<span class="input-group-text">R</span>
								<input type="number" class="form-control" step="0.01" min="0" required>
							</div>


							<div class = "d-grid">
								<button type = "submit" class = "btn btn-primary">
									Send Data
								</button>
							</div>
						</form>

					</div>
				</div>
			</section>
		</main>
		<footer class = "text-center">
			&copy; 2026 Fezile Ngubane. All rights reserved.
		</footer>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
